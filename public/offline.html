<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6f0" />
    <title>कामगार — इंटरनेट नहीं है</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #faf6f0;
        color: #262220;
        font-family: 'Noto Sans', 'Noto Sans Devanagari', system-ui, 'Segoe UI', sans-serif;
        line-height: 1.55;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #e8e0d5;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 8px 24px -18px rgba(38, 34, 32, 0.35);
      }
      .icon { font-size: 44px; }
      h1 { font-size: 20px; margin: 12px 0 6px; }
      p { margin: 0; color: #574f49; font-size: 15px; }
      ul {
        text-align: right;
        margin: 18px 0 0;
        padding: 0 18px 0 0;
        color: #574f49;
        font-size: 14px;
      }
      ul { text-align: start; padding: 0 0 0 18px; }
      li { margin-bottom: 4px; }
      button {
        margin-top: 22px;
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 16px;
        background: #c0562f;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
      .note { margin-top: 14px; font-size: 12px; color: #8b8179; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📶</div>
      <h1>इंटरनेट कनेक्शन नहीं है</h1>
      <p>कामगार खोलने के लिए इंटरनेट चाहिए, ताकि आपको काम और हाजिरी की सही जानकारी मिले।</p>
      <ul>
        <li>मोबाइल डेटा या वाई-फाई चालू करें</li>
        <li>फ्लाइट मोड बंद है, यह देख लें</li>
        <li>नेटवर्क आने पर फिर से कोशिश करें</li>
      </ul>
      <button onclick="location.reload()">फिर से कोशिश करें</button>
      <p class="note">
        आपकी हाजिरी और मजदूरी का हिसाब सुरक्षित है — इंटरनेट आते ही सब दिख जाएगा।
      </p>
    </div>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
